<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFMT | Gestor de Oferta V8.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>


<header class="main-header">
    <div class="header-container">
        <div class="brand">
            <h1>UFMT</h1>
            <span>Organizador de Horários</span>
        </div>
        <div class="controles">
            <div class="select-group">
                <label>Período Letivo:</label>
                <select id="periodoAtual" onchange="salvarEAtualizar()"></select>
            </div>
            <div class="select-group">
                <label>PPC:</label>
                <select id="filtroPPC" onchange="salvarEAtualizar()">
                    <option value="20251">PPC 2025/1 (Antigo)</option>
                    <option value="20261" selected>PPC 2026/1 (Novo)</option>
                </select>
            </div>
            <div class="select-group">
                <label>Semestre:</label>
                <select id="filtroSemestre" onchange="salvarEAtualizar()"></select>
            </div>
            <button onclick="resetAbsoluto()" class="btn-danger-outline">Resetar Sistema</button>
        </div>
    </div>
</header>

<main class="app-layout">
    <aside class="sidebar">
        <div id="listaDisciplinas" class="lista-disciplinas"></div>

        <div id="formConfig" class="card form-detalhes" style="display:none; border-top: 5px solid var(--primary);">
            <h4>Configurar Planejamento</h4>
            <p id="nomeDiscSelecionada" class="highlight-text" style="color:var(--primary); font-weight:800;"></p>

            <div class="config-box">
                <label>1. Turmas (etiquetas separadas por vírgula):</label>
                <input type="text" id="inputEtiquetas" placeholder="Ex: EC1, EC2" oninput="sincronizarInterface()">
            </div>

            <div class="config-box">
                <label>2. Meta de Slots (por Turma):</label>
                <div class="input-row">
                    <div class="field">
                        <label>Teoria:</label>
                        <input type="number" id="metaT" value="1" min="0" oninput="atualizarStatusCarga()">
                    </div>
                    <div class="field">
                        <label>Prática:</label>
                        <input type="number" id="metaP" value="1" min="0" oninput="atualizarStatusCarga()">
                    </div>
                </div>
            </div>

            <div class="config-box alocacao-bg">
                <label>3. Adicionar Aula:</label>
                <div class="field">
                    <label>Tipo:</label>
                    <select id="tipoAula">
                        <option value="Teórica">Teórica</option>
                        <option value="Prática">Prática</option>
                    </select>
                </div>
                <div class="field">
                    <label>Público:</label>
                    <select id="selectVinc">
                        <option value="GERAL">Todas as Turmas (Geral)</option>
                    </select>
                </div>
                <div class="field">
                    <label>Professor:</label>
                    <input type="text" id="profNome" placeholder="Nome do docente">
                </div>
            </div>

            <div id="statusCargaDinamica" class="status-resumo-sidebar"></div>
        </div>
    </aside>

    <section class="grid-content">
        <div class="grid-container">
            <h2 id="tituloPeriodo" style="text-align: center; color: var(--primary);"></h2>
            <table class="horario-table">
                <thead>
                <tr>
                    <th>Horário</th>
                    <th>Segunda</th>
                    <th>Terça</th>
                    <th>Quarta</th>
                    <th>Quinta</th>
                    <th>Sexta</th>
                </tr>
                </thead>
                <tbody id="corpoTabela"></tbody>
            </table>
        </div>

        <div class="matriz-resumo">
            <h3>Quadro de Migração PPC</h3>
            <div class="ppc-section">
                <div class="ppc-tag antigo">PPC 2025/1 (ANTIGO)</div>
                <div id="matriz2025" class="grid-matriz"></div>
            </div>
            <div class="ppc-section">
                <div class="ppc-tag novo">PPC 2026/1 (NOVO)</div>
                <div id="matriz2026" class="grid-matriz"></div>
            </div>
        </div>
    </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
