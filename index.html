<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFMT | Gestor de Oferta Acadêmica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="brand"><h1>UFMT</h1><span>Gestor de Oferta</span></div>
        <div class="controles">
            <div class="select-group">
                <label>Período Letivo:</label>
                <select id="periodoAtual" onchange="salvarEAtualizar()"></select>
            </div>
            <div class="select-group">
                <label>PPC:</label>
                <select id="filtroPPC" onchange="mudarFiltros()">
                    <option value="20251">PPC 2025/1</option>
                    <option value="20261" selected>PPC 2026/1</option>
                </select>
            </div>
            <div class="select-group">
                <label>Semestre Ofertado:</label>
                <select id="filtroSemestre" onchange="mudarFiltros()"></select>
            </div>
            <div class="btns-header">
                <button onclick="document.getElementById('importFile').click()" class="btn-outline">📂 Importar</button>
                <input type="file" id="importFile" style="display:none" onchange="importarJSON(this)">
                <button onclick="exportarJSON()" class="btn-outline">💾 JSON</button>
                <button onclick="exportarExcel()" class="btn-outline">📊 Grade Excel</button>
                <button onclick="exportarEncargosExcel()" class="btn-outline">📊 Encargos Excel</button>
                <button onclick="imprimirRelatorioCompleto()" class="btn-outline">📋 Relatório Disciplinas</button>
                <button onclick="imprimirRelatorioEncargos()" class="btn-outline">👨‍🏫 Relatório Encargos</button>
                <button onclick="window.print()" class="btn-outline">📄 PDF Grade</button>
                <button onclick="resetAbsoluto()" class="btn-danger-outline">Resetar</button>
            </div>
        </div>
    </div>
</header>



<main class="app-layout">
    <aside class="sidebar">
        <h4>Disciplinas do Semestre</h4>
        <div id="listaDisciplinas"></div>
        <div class="config-box optativas-box">
            <label>✨ Optativas:</label>
            <select id="selectOptativas" onchange="selecionarOptativa(this.value)"></select>
        </div>
    </aside>

    <section class="grid-content">
        <table class="horario-table">
            <thead>
            <tr><th>Horário</th><th>Segunda</th><th>Terça</th><th>Quarta</th><th>Quinta</th><th>Sexta</th></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>

        <div class="matriz-resumo">
            <h3>Conferência de Oferta (PPC)</h3>
            <div id="matriz-20251" class="ppc-container-horizontal antigo-border"></div>
            <div id="matriz-20261" class="ppc-container-horizontal novo-border"></div>
        </div>
    </section>
</main>

<div id="modalAula" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <h4 id="modalTitle">Configurar Aula</h4>
        <div class="config-grid">
            <div class="field"><label>Turmas:</label><input type="text" id="editTurmas"></div>
            <div class="field"><label>Professor:</label><input type="text" id="editProf"></div>
            <div class="field"><label>Sala/Local:</label><input type="text" id="editSala"></div>
            <div class="field">
                <label>Tipo:</label>
                <select id="editTipo"><option value="Teórica">Teórica</option><option value="Prática">Prática</option></select>
            </div>
        </div>
        <div class="modal-btns">
            <button onclick="fecharModal()" class="btn-outline">Cancelar</button>
            <button onclick="confirmarAlocacao()" class="btn-primary-full">Confirmar</button>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
