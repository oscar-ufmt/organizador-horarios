<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFMT | Gestão de Horários e Turmas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="brand">
            <h1>UFMT</h1>
            <span>Organizador de Horários</span>
        </div>
        <div class="controles">
            <div class="select-group">
                <label>PPC:</label>
                <select id="filtroPPC" onchange="carregarDisciplinas()">
                    <option value="20251">2025/1</option>
                    <option value="20261" selected>2026/1</option>
                </select>
            </div>
            <div class="select-group">
                <label>Semestre:</label>
                <select id="filtroSemestre" onchange="carregarDisciplinas()"></select>
            </div>
            <button onclick="window.print()" class="btn-outline">📄 Gerar PDF (L)</button>
            <button onclick="limparGrade()" class="btn-danger-outline">Limpar Grade</button>
        </div>
    </div>
</header>

<main class="app-layout">
    <aside class="sidebar">
        <h3>Disciplinas Disponíveis</h3>
        <div id="listaDisciplinas" class="lista-disciplinas"></div>

        <div id="formConfig" class="card form-detalhes" style="display:none;">
            <h4>Configurar Alocação</h4>
            <p id="nomeDiscSelecionada" class="highlight-text"></p>

            <div class="input-row">
                <div class="field">
                    <label>Identificação da Turma:</label>
                    <input type="text" id="turmaId" placeholder="Ex: A, B, T1 ou VE1" oninput="atualizarStatusCarga()">
                </div>
            </div>

            <div class="input-row">
                <div class="field">
                    <label>Professor:</label>
                    <input type="text" id="profNome" placeholder="Nome do docente">
                </div>
            </div>

            <div class="input-row grid-2">
                <div class="field">
                    <label>Sala/Local:</label>
                    <input type="text" id="salaAula" placeholder="Ex: Lab 01">
                </div>
                <div class="field">
                    <label>Tipo:</label>
                    <select id="tipoAula">
                        <option value="Teórica">Teórica</option>
                        <option value="Prática">Prática</option>
                        <option value="Laboratório">Laboratório</option>
                    </select>
                </div>
            </div>

            <div class="status-box">
                <div class="ch-info">Carga Disciplina: <span id="chTotal">0</span>h</div>
                <div class="ch-info">Restante (Nesta Turma): <span id="chRestante" class="danger-text">0</span>h</div>
            </div>
            <p class="instrucao">Selecione a turma e clique no <b>+</b> da grade.</p>
        </div>
    </aside>

    <section class="grid-container">
        <table class="horario-table" id="tabelaHorarios">
            <thead>
            <tr>
                <th>Horário</th>
                <th>Segunda</th>
                <th>Terça</th>
                <th>Quarta</th>
                <th>Quinta</th>
                <th>Sexta</th>
            </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </section>
</main>

<script src="js/script.js"></script>
</body>
</html>
